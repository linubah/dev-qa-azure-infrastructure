name: terraform iac

on:
  # Only Terraform changes need a plan. Editing the README should not touch Azure.
  # The workflow file is included so a pipeline change gets verified too.
  pull_request:
    paths:
      - 'environment/**'
      - '.github/workflows/**'
  push:
    branches: [env/dev]
    paths:
      - 'environment/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    uses: linubah/dev-qa-azure-infrastructure/.github/workflows/terraform.yml@main
    with:
      environment: dev
      var_file: dev.tfvars
      plan_client_id: ${{ vars.AZURE_CLIENT_ID_DEV }}
      apply: ${{ github.event_name != 'pull_request' }}
