# Thin caller. The pipeline itself lives on main so both env branches share one copy.

name: deploy

on:
  pull_request:
  push:
    branches: [env/dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    uses: linubah/dev-qa-azure-infrastructure/.github/workflows/terraform.yml@main
    with:
      environment: dev
      var_file: dev.tfvars
      plan_client_id: ${{ vars.AZURE_CLIENT_ID_DEV }}
      apply: ${{ github.event_name != 'pull_request' }}
